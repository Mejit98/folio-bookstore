<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход и регистрация — Фолиант</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="container header-in"><a class="logo" href="index.html"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6c4-2 8-2 12 1 4-3 8-3 12-1v19c-4-2-8-2-12 1-4-3-8-3-12-1z" fill="#7A2E3A"/><path d="M16 7v19" stroke="#C8963E" stroke-width="2"/></svg><span>Фолиант</span></a><form class="search" role="search" onsubmit="return false"><input type="search" list="suggest" placeholder="Поиск по названию или автору" aria-label="Поиск по каталогу" data-tip="Начните вводить — появятся подсказки"><button class="btn btn--primary btn--sm" type="submit">Найти</button></form><datalist id="suggest"><option value="Мастер и Маргарита"><option value="Преступление и наказание"><option value="1984"><option value="Маленький принц"><option value="Шерлок Холмс. Рассказы"><option value="Война и мир. Том 1"><option value="Три товарища"><option value="Понедельник начинается в субботу"><option value="А. Конан Дойл"><option value="А. де Сент-Экзюпери"><option value="А. и Б. Стругацкие"><option value="Дж. Оруэлл"><option value="Л. Толстой"><option value="М. Булгаков"><option value="Ф. Достоевский"><option value="Э. М. Ремарк"></datalist><nav class="nav" aria-label="Основное меню"><a href="index.html">Каталог</a><a href="author.html">Для авторов</a></nav><div class="user-box"><a class="btn btn--ghost" href="login.html">Войти</a><a class="btn btn--primary" href="login.html#register">Регистрация</a></div></div></header>
<main class="auth-bg"><div class="card auth-card"><h1 style="text-align:center">Добро пожаловать</h1><p class="muted" style="text-align:center">Войдите или создайте учётную запись покупателя</p><div id="auth-box"><div class="tabs" data-tabs="#auth-box"><button class="active" data-target="#t-login">Вход</button><button data-target="#t-reg">Регистрация</button></div><div class="tab-panel active" id="t-login"><form data-validate novalidate data-success="Вход выполнен (прототип)"><div class="field"><label for="l-email" class="req">Электронная почта</label><input id="l-email" type="email" data-rule="required email" placeholder="name@example.com" ><div class="field__error" role="alert"></div></div><div class="field"><label for="l-pass" class="req">Пароль</label><input id="l-pass" type="password" data-rule="required" placeholder="Введите пароль" ><div class="field__error" role="alert"></div></div><button class="btn btn--primary btn--block" type="submit">Войти</button></form></div><div class="tab-panel" id="t-reg"><form data-validate novalidate data-success="Учётная запись создана (прототип)"><div class="field"><label for="r-name" class="req">Имя</label><input id="r-name" type="text" data-rule="required" placeholder="Как к вам обращаться" ><div class="field__error" role="alert"></div></div><div class="field"><label for="r-email" class="req">Электронная почта</label><input id="r-email" type="email" data-rule="required email" placeholder="name@example.com" ><div class="field__error" role="alert"></div></div><div class="field"><label for="r-pass" class="req">Пароль</label><input id="r-pass" type="password" data-rule="required min:8" placeholder="Не менее 8 символов" ><div class="hint">Не менее 8 символов, используйте буквы и цифры</div><div class="field__error" role="alert"></div></div><div class="field"><label for="r-pass2" class="req">Повторите пароль</label><input id="r-pass2" type="password" data-rule="required" placeholder="Повторите пароль" data-match="#r-pass"><div class="field__error" role="alert"></div></div><button class="btn btn--primary btn--block" type="submit">Зарегистрироваться</button></form></div></div></div></main>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
